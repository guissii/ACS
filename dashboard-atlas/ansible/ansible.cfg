[defaults]
inventory         = inventory.yml
host_key_checking = False
retry_files_enabled = False
stdout_callback   = yaml
timeout           = 30

[persistent_connection]
command_timeout = 60
connect_timeout = 60

[ssh_connection]
# Accepter les anciens algorithmes cryptographiques proposés par les CSR1000V (IOS-XE)
# Prouvé fonctionnel lors du diagnostic : "diffie-hellman-group14-sha1" et "ssh-rsa"
# ProxyJump via alpine-admin (192.168.199.4) = seul hôte ayant accès au réseau GNS3
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o KexAlgorithms=+diffie-hellman-group14-sha1,diffie-hellman-group-exchange-sha1 -o HostKeyAlgorithms=+ssh-rsa -o ProxyJump=root@192.168.199.4
