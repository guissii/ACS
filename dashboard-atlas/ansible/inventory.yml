all:
  children:
    csr_benguerir:
      hosts:
        CSR-BGR-1:
          ansible_host: 10.100.40.2
        CSR-BGR-2:
          ansible_host: 10.100.41.2
    csr_backup:
      hosts:
        CSR-BKP-1:
          ansible_host: 10.200.40.2
        CSR-BKP-2:
          ansible_host: 10.200.41.2
    fortigate:
      hosts:
        FGT-BGR-1-1:
          ansible_host: 10.100.40.1
        FGT-BKP-1-1:
          ansible_host: 10.200.40.1
  vars:
    # ── Connexion réseau ──────────────────────────────────────────
    ansible_connection: network_cli
    ansible_user: "{{ vault_username }}"
    ansible_password: "{{ vault_password }}"

    # ── Jump Host : alpine-admin (seul accès au réseau GNS3) ─────
    # VM Ubuntu → alpine-admin (192.168.199.4) → équipements CSR/FGT
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -o KexAlgorithms=+diffie-hellman-group14-sha1,diffie-hellman-group-exchange-sha1
      -o HostKeyAlgorithms=+ssh-rsa
      -o ProxyCommand="docker exec -i $(docker ps -q --filter ancestor=alpine-admin-final:latest || docker ps -q --filter name=alpine) nc %h %p"
