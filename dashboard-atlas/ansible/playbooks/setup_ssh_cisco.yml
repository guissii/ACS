---
- name: Configuration de l'accès SSH (admin/admin) sur les équipements Cisco (CSR & IOU)
  hosts: csr_benguerir:csr_backup
  gather_facts: no
  connection: network_cli

  tasks:
    - name: Appliquer la configuration SSH v2 et l'utilisateur admin
      cisco.ios.ios_config:
        lines:
          - ip domain-name atlascloud.local
          - username admin privilege 15 secret admin
          - ip ssh version 2
          - ip ssh time-out 60
          - ip ssh authentication-retries 3
          - line vty 0 15
          -  login local
          -  transport input ssh

    - name: Génération de la clé RSA (si absente)
      cisco.ios.ios_command:
        commands:
          - "crypto key generate rsa modulus 2048"
      ignore_errors: yes

    - name: Sauvegarder la configuration en NVRAM (write memory)
      cisco.ios.ios_command:
        commands:
          - "write memory"
